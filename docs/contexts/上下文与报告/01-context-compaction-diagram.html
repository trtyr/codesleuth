<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Context Compression Architecture — codesleuth D013 v2</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    background: #020617;
    color: #e2e8f0;
    padding: 24px;
    min-height: 100vh;
  }
  #report-container {
    max-width: 1080px;
    margin: 0 auto;
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 24px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid #1e293b;
  }
  .pulse-dot {
    width: 10px;
    height: 10px;
    background: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); }
    70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }
  .header-text h1 {
    font-size: 15px;
    font-weight: 600;
    color: white;
    letter-spacing: 0.2px;
  }
  .header-text p {
    font-size: 10px;
    color: #94a3b8;
    margin-top: 3px;
  }
  .diagram {
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 8px;
    overflow: auto;
  }
  svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .footer {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #1e293b;
    font-size: 8px;
    color: #64748b;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<div id="report-container">
  <div class="header">
    <div class="pulse-dot"></div>
    <div class="header-text">
      <h1>Context Compression — codesleuth D013 v2</h1>
      <p>Deterministic three-phase compaction driven by Harness::run · zero-LLM handoff · audit-traced recall</p>
    </div>
  </div>
  <div class="diagram">

      <defs>

        <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">

        </marker>
        <marker id="ah-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
        </marker>
        <marker id="ah-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>

        <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">

        <!-- A11: recall_message -> next run -->
        <path d="M 860 530 L 860 566" stroke="#34d399" marker-end="url(#ah-emerald)"/>
        <!-- A12: D013 spec -> should_compact (governance) -->
        <path d="M 240 510 C 285 510 285 330 286 322" stroke="#fbbf24" stroke-dasharray="4,4" marker-end="url(#ah-amber)"/>

      <text x="500" y="82" fill="#fbbf24" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1.5">HARNESS::RUN COMPRESSION CORE</text>

      <text x="500" y="192" fill="#64748b" font-size="8" text-anchor="middle">src/harness.rs:25-44, 74, 100-109</text>

      <text x="500" y="514" fill="#94a3b8" font-size="9" text-anchor="middle">tool/assistant pairing fallback — never split</text>
