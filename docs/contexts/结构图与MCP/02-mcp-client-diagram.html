<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MCP 客户端 · 组件与调用关系架构图</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#020617;color:#e2e8f0;font-family:'JetBrains Mono',ui-monospace,monospace;min-height:100vh;padding:32px 24px}
  .container{max-width:1200px;margin:0 auto}
  .header{display:flex;align-items:center;gap:14px;margin-bottom:6px}

  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,0.5)}70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  h1{font-size:18px;font-weight:600;color:#f1f5f9;letter-spacing:-0.01em}
  .subtitle{font-size:11px;color:#64748b;margin-bottom:20px;padding-left:24px}
  .diagram-card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:16px;margin-bottom:16px}
  svg{display:block;width:100%;height:auto}
  .footer{font-size:9px;color:#475569;text-align:right;margin-top:8px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="pulse-dot"></div>
    <h1>MCP 客户端 · 组件与调用关系架构</h1>
  </div>
  <div class="subtitle">codesleuth · stdio 子进程 + newline-delimited JSON-RPC · 2026-10-07</div>

  <div class="diagram-card">
    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
        </marker>
        <marker id="arrowhead-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
        </marker>
        <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
        </marker>
      </defs>

      <rect width="1000" height="680" fill="#020617"/>
      <rect width="1000" height="680" fill="url(#grid)"/>

      <!-- ===== Arrows (early z-order, render behind component boxes) ===== -->

      <!-- 1. CodegraphEngine.start_with_bin -> bootlock.acquire_guard -->
      <line x1="150" y1="210" x2="150" y2="244" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <text x="158" y="232" fill="#94a3b8" font-size="8" font-family="JetBrains Mono">1. acquire_guard</text>

      <!-- 2. CodegraphEngine -> McpClient.spawn -->
      <line x1="250" y1="110" x2="284" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <text x="248" y="104" fill="#94a3b8" font-size="7" font-family="JetBrains Mono" text-anchor="end">2. spawn(bin, [serve, --mcp], root)</text>

      <!-- 3. CodegraphEngine.call -> McpClient.call_tool -->
      <line x1="250" y1="180" x2="284" y2="180" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrowhead)"/>
      <text x="248" y="174" fill="#94a3b8" font-size="7" font-family="JetBrains Mono" text-anchor="end">call → call_tool + projectPath</text>

      <!-- 4. bootlock -> McpClient (release then initialize) -->
      <line x1="250" y1="275" x2="284" y2="275" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <text x="248" y="290" fill="#94a3b8" font-size="7" font-family="JetBrains Mono" text-anchor="end">3. release → initialize</text>

      <!-- 5. McpClient -> codegraph serve (subprocess launch) -->
      <line x1="610" y1="110" x2="644" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <text x="627" y="103" fill="#94a3b8" font-size="7" font-family="JetBrains Mono" text-anchor="middle">4. tokio Command</text>

      <!-- 6. JSON-RPC bus (stdin/stdout, bidirectional) -->
      <line x1="610" y1="165" x2="650" y2="165" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrowhead-orange)"/>
      <line x1="650" y1="195" x2="610" y2="195" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrowhead-orange)"/>
      <rect x="612" y="173" width="36" height="14" rx="3" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="0.8"/>
      <text x="630" y="183" fill="#fb923c" font-size="6" font-family="JetBrains Mono" text-anchor="middle" font-weight="600">JSON-RPC</text>
      <text x="630" y="156" fill="#94a3b8" font-size="6" font-family="JetBrains Mono" text-anchor="middle">stdin (req)</text>
      <text x="630" y="207" fill="#94a3b8" font-size="6" font-family="JetBrains Mono" text-anchor="middle">stdout (resp/notify)</text>

      <!-- 7. McpClient.spawn -> env vars -->
      <path d="M 610 250 Q 645 260 644 280" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2" fill="none" marker-end="url(#arrowhead)"/>
      <text x="630" y="244" fill="#94a3b8" font-size="7" font-family="JetBrains Mono">5. env</text>

      <!-- 8. McpClient request errors -> CsError (CS4xxx) -->
      <path d="M 330 460 L 330 494" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowhead-rose)"/>
      <text x="340" y="482" fill="#fb7185" font-size="7" font-family="JetBrains Mono">6. 错误映射</text>

      <!-- ===== Region boundary: codesleuth process ===== -->
      <rect x="20" y="50" width="960" height="550" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.7"/>
      <text x="40" y="42" fill="#fbbf24" font-size="10" font-weight="600" font-family="JetBrains Mono">codesleuth process · tokio runtime</text>

      <!-- ===== Components ===== -->

      <!-- CodegraphEngine (Frontend / cyan) -->
      <rect x="50" y="80" width="200" height="130" rx="6" fill="#0f172a"/>
      <rect x="50" y="80" width="200" height="130" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="150" y="100" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono">CodegraphEngine</text>
      <text x="150" y="115" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono">src/tools/graph.rs</text>
      <line x1="65" y1="123" x2="235" y2="123" stroke="#1e293b" stroke-width="0.5"/>
      <text x="60" y="139" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">• client: McpClient</text>
      <text x="60" y="153" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">• project_path: PathBuf</text>
      <text x="60" y="172" fill="#22d3ee" font-size="8" font-family="JetBrains Mono">start_with_bin(root, bin, force)</text>
      <text x="60" y="186" fill="#22d3ee" font-size="8" font-family="JetBrains Mono">call(tool, args) → call_tool</text>
      <text x="60" y="202" fill="#94a3b8" font-size="7" font-family="JetBrains Mono">构造: start() → start_with_bin</text>

      <!-- bootlock::acquire_guard (Security / rose, dashed) -->
      <rect x="50" y="250" width="200" height="50" rx="6" fill="#0f172a"/>
      <rect x="50" y="250" width="200" height="50" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="150" y="270" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono">bootlock::acquire_guard</text>
      <text x="150" y="287" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono">src/tools/graph.rs:80-89 · 索引引导串行化</text>

      <rect x="290" y="80" width="320" height="380" rx="6" fill="#0f172a"/>
      <rect x="290" y="80" width="320" height="380" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="450" y="100" fill="white" font-size="13" font-weight="700" text-anchor="middle" font-family="JetBrains Mono">McpClient</text>
      <text x="450" y="116" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono">src/mcp.rs:16-204</text>

      <text x="305" y="138" fill="#34d399" font-size="9" font-weight="600" font-family="JetBrains Mono">▸ fields</text>
      <line x1="305" y1="143" x2="595" y2="143" stroke="#1e293b" stroke-width="0.5"/>
      <text x="305" y="158" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">child: Mutex&lt;tokio::process::Child&gt;</text>
      <text x="305" y="172" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">stdin: Mutex&lt;ChildStdin&gt;</text>
      <text x="305" y="186" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">reader: Mutex&lt;BufReader&lt;ChildStdout&gt;&gt;</text>
      <text x="305" y="200" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">next_id: AtomicU64</text>
      <text x="305" y="214" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">timeout: Duration (default 90s)</text>

      <text x="305" y="234" fill="#34d399" font-size="9" font-weight="600" font-family="JetBrains Mono">▸ methods</text>
      <line x1="305" y1="239" x2="595" y2="239" stroke="#1e293b" stroke-width="0.5"/>
      <text x="305" y="254" fill="#e2e8f0" font-size="9" font-family="JetBrains Mono">spawn(bin, [serve, --mcp], root)</text>
      <text x="540" y="254" fill="#64748b" font-size="7" font-family="JetBrains Mono">:68-102</text>
      <text x="305" y="268" fill="#e2e8f0" font-size="9" font-family="JetBrains Mono">initialize() + notifications/initialized</text>
      <text x="540" y="268" fill="#64748b" font-size="7" font-family="JetBrains Mono">:104-114</text>
      <text x="305" y="282" fill="#e2e8f0" font-size="9" font-family="JetBrains Mono">list_tools() → tools/list (每次, 无缓存)</text>
      <text x="540" y="282" fill="#64748b" font-size="7" font-family="JetBrains Mono">:115-126</text>
      <text x="305" y="296" fill="#e2e8f0" font-size="9" font-family="JetBrains Mono">call_tool(name, args) → tools/call</text>
      <text x="540" y="296" fill="#64748b" font-size="7" font-family="JetBrains Mono">:128-133</text>
      <text x="305" y="310" fill="#e2e8f0" font-size="9" font-family="JetBrains Mono">request(method, params) · 核心循环</text>
      <text x="540" y="310" fill="#64748b" font-size="7" font-family="JetBrains Mono">:152-190</text>
      <text x="305" y="324" fill="#e2e8f0" font-size="9" font-family="JetBrains Mono">build_request / extract_tool_text</text>
      <text x="540" y="324" fill="#64748b" font-size="7" font-family="JetBrains Mono">:16-53</text>

      <text x="305" y="344" fill="#fb7185" font-size="9" font-weight="600" font-family="JetBrains Mono">▸ protocol &amp; 错误</text>
      <line x1="305" y1="349" x2="595" y2="349" stroke="#1e293b" stroke-width="0.5"/>
      <text x="305" y="364" fill="#cbd5e1" font-size="8" font-family="JetBrains Mono">· fetch_add(SeqCst) 自增 next_id</text>
      <text x="305" y="378" fill="#cbd5e1" font-size="8" font-family="JetBrains Mono">· 非法行 / 通知 / 不匹配 id 一律 continue</text>
      <text x="305" y="392" fill="#cbd5e1" font-size="8" font-family="JetBrains Mono">· timeout_at(deadline, read_line) 单次</text>
      <text x="305" y="406" fill="#cbd5e1" font-size="8" font-family="JetBrains Mono">· protocolVersion "2025-03-26", clientInfo "codesleuth"</text>
      <text x="305" y="420" fill="#fb7185" font-size="8" font-family="JetBrains Mono">· EOF(n=0) → INDEX_NOT_AVAILABLE</text>
      <text x="305" y="434" fill="#fb7185" font-size="8" font-family="JetBrains Mono">· v["error"] / 空 text / isError → INDEX_BUILD_FAILED</text>
      <text x="305" y="448" fill="#fb7185" font-size="8" font-family="JetBrains Mono">· Drop: try_lock(child) + start_kill</text>

      <!-- codegraph serve --mcp (External / slate) -->
      <rect x="650" y="80" width="280" height="130" rx="6" fill="#0f172a"/>
      <rect x="650" y="80" width="280" height="130" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="790" y="100" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono">codegraph serve --mcp</text>
      <text x="790" y="116" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono">外部子进程 · tokio::process::Command</text>
      <line x1="665" y1="125" x2="915" y2="125" stroke="#1e293b" stroke-width="0.5"/>
      <text x="660" y="142" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">• stdin ← JSON-RPC 请求 (newline-delimited)</text>
      <text x="660" y="156" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">• stdout → JSON-RPC 响应 / 通知</text>
      <text x="660" y="170" fill="#94a3b8" font-size="8" font-family="JetBrains Mono">• stderr → Stdio::null()</text>
      <text x="660" y="186" fill="#94a3b8" font-size="8" font-family="JetBrains Mono">• ErrorKind::NotFound → INDEX_NOT_AVAILABLE + 安装 hint</text>
      <text x="660" y="200" fill="#94a3b8" font-size="8" font-family="JetBrains Mono">• 依赖 notifications/initialized 完成握手 (推断)</text>

      <!-- env vars (External / slate, dashed) -->
      <rect x="650" y="250" width="280" height="70" rx="6" fill="#0f172a"/>
      <rect x="650" y="250" width="280" height="70" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="790" y="270" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono">子进程环境变量 (spawn 时设置)</text>
      <line x1="665" y1="278" x2="915" y2="278" stroke="#1e293b" stroke-width="0.5"/>
      <text x="660" y="295" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">CODEGRAPH_TELEMETRY=0</text>
      <text x="820" y="295" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">DO_NOT_TRACK=1</text>
      <text x="790" y="311" fill="#94a3b8" font-size="7" text-anchor="middle" font-family="JetBrains Mono">src/mcp.rs:68-102</text>

      <!-- CsError / CsCode (Security / rose, dashed) -->
      <rect x="50" y="500" width="880" height="80" rx="6" fill="#0f172a"/>

      <text x="490" y="535" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono">CS4xxx 段位 → CsCode::exit_code (4000..=4999 → exit 5)</text>
      <line x1="70" y1="542" x2="910" y2="542" stroke="#1e293b" stroke-width="0.5"/>

      <text x="240" y="558" fill="#fb7185" font-size="8" font-family="JetBrains Mono">4011 INDEX_BUILD_FAILED</text>

        <g transform="translate(545, 0)">
