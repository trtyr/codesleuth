[package]
name = "codesleuth"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only codebase scout agent: a complete agent-harness CLI that searches codebases and returns evidence-backed reports"
license = "MIT"
repository = "https://github.com/trtyr/codesleuth"
homepage = "https://github.com/trtyr/codesleuth"
readme = "README.md"
keywords = ["agent", "code-search", "cli", "llm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
async-openai = { version = "0.42.1", features = ["_api", "chat-completion", "chat-completion-types"] }
async-trait = "0.1.92"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dunce = "1"
fff-search = "0.11.0"
hnsw_rs = "0.3.4"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53.2", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
